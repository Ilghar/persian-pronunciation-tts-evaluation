# Stdlib only: no runtime dependencies and no build dependencies (in-tree backend, works offline).
[build-system]
requires = []
build-backend = "backend"
backend-path = ["_build"]

[project]
name = "persian-pronunciation-tts-evaluation"
version = "0.8.0"
